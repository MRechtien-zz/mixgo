#
# Configuration for Behringer X Air 18 controlled by a MIDI foot controller.
#
input:
  type: portmidi
  device: MIDIMATE II Port 1
  channel: 0

output:
  type: xr
  address: 10.10.10.10:10024

bindings:
  - action: mute_group
    control: 0
    target: 2
    on_value: 127
    mode: absolute
  - action: mute_group
    control: 1
    target: 3
    on_value: 127
    mode: absolute
  - action: tap_delay
    control: 2
    target: 2
    on_value: 127
