#
# Configuration for Allen & Heath QU 24 controlled by a MIDI foot controller.
#
input:
  type: portmidi
  device: MIDIMATE II Port 1
  channel: 0

output:
  type: qu
  address: 192.168.0.150:51325

bindings:
  - action: mute_group
    control: 0
    target: 2
    on_value: 127
    mode: absolute
  - action: mute_group
    control: 1
    target: 3
    on_value: 127
    mode: absolute
  - action: tap_delay
    control: 2
    target: 2
    on_value: 127
